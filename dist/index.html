*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

:root {
  --cyan: #63d4ff;
  --violet: #a78bfa;
  --bg: #050810;
  --bg2: #080c18;
  --surface: rgba(255,255,255,0.025);
  --border: rgba(255,255,255,0.07);
  --border-cyan: rgba(99,212,255,0.18);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --dim: #64748b;
}

body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

.portfolio-root {
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── GRAIN OVERLAY ── */
.portfolio-root::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 1.1rem 3rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(20px) saturate(1.4);
  background: rgba(5,8,16,0.85);
  border-bottom: 1px solid var(--border);
  transition: box-shadow 0.3s ease;
}

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}

.nav-links { display: flex; gap: 2.2rem; list-style: none; }

.nav-links a {
  font-family: 'DM Mono', monospace;
  font-size: 0.69rem;
  color: var(--dim);
  text-decoration: none;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: color 0.2s;
  position: relative;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 0;
  width: 0; height: 1px;
  background: var(--cyan);
  transition: width 0.25s ease;
}

.nav-links a:hover { color: var(--cyan); }
.nav-links a:hover::after { width: 100%; }

.nav-download {
  font-family: 'DM Mono', monospace;
  font-size: 0.69rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.55rem 1.3rem;
  background: transparent;
  border: 1px solid var(--border-cyan);
  color: var(--cyan);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}

.nav-download:hover {
  background: rgba(99,212,255,0.1);
  border-color: var(--cyan);
  box-shadow: 0 0 16px rgba(99,212,255,0.12);
}

/* ── HAMBURGER ── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  z-index: 110;
}

.nav-hamburger span {
  display: block;
  width: 22px;
  height: 1.5px;
  background: var(--muted);
  transition: all 0.28s ease;
  transform-origin: center;
}

.nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); background: var(--cyan); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); background: var(--cyan); }

/* ── MOBILE DRAWER ── */
.mobile-drawer {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,8,16,0.97);
  backdrop-filter: blur(24px);
  z-index: 99;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.mobile-drawer.open {
  display: flex;
  opacity: 1;
  pointer-events: all;
}

.mobile-drawer a {
  font-family: 'Syne', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--muted);
  text-decoration: none;
  letter-spacing: -0.02em;
  transition: color 0.2s;
}

.mobile-drawer a:hover { color: var(--cyan); }

.mobile-drawer .drawer-resume {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.75rem 2rem;
  border: 1px solid var(--border-cyan);
  color: var(--cyan);
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 1rem;
}

/* ── HERO ── */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 7rem 3rem 5rem;
  overflow: hidden;
}

.hero-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(99,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,212,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
  pointer-events: none;
}

.hero-glow {
  position: absolute;
  width: 800px; height: 800px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99,212,255,0.055) 0%, transparent 65%);
  top: -200px; left: -250px;
  pointer-events: none;
}

.hero-glow-2 {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(167,139,250,0.065) 0%, transparent 65%);
  bottom: -100px; right: -80px;
  pointer-events: none;
}

.hero-inner {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4rem;
}

.hero-content { flex: 1; max-width: 620px; }

/* ── PROFILE PHOTO ── */
.hero-photo-wrap {
  position: relative;
  flex-shrink: 0;
  width: 280px;
  height: 280px;
}

.hero-photo-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--violet), var(--cyan));
  background-size: 200% 200%;
  animation: gradientSpin 4s linear infinite;
  z-index: 0;
}

@keyframes gradientSpin {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.hero-photo-inner {
  position: relative;
  z-index: 1;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: linear-gradient(145deg, #1a2540, #0d1628);
  border: 3px solid var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.hero-photo-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}

.hero-photo-initials {
  font-family: 'Syne', sans-serif;
  font-size: 4.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.04em;
  user-select: none;
}

.hero-photo-badge {
  position: absolute;
  bottom: 10px; right: 10px;
  background: linear-gradient(135deg, #0f2027, #1a3a50);
  border: 1px solid var(--border-cyan);
  border-radius: 20px;
  padding: 0.35rem 0.9rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cyan);
  z-index: 2;
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  white-space: nowrap;
}

.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(0.8); }
}

.hero-photo-wrap::before,
.hero-photo-wrap::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--cyan);
  border-style: solid;
  opacity: 0.35;
  z-index: 3;
}
.hero-photo-wrap::before {
  top: -14px; left: -14px;
  border-width: 2px 0 0 2px;
  border-radius: 3px 0 0 0;
}
.hero-photo-wrap::after {
  bottom: -14px; right: -14px;
  border-width: 0 2px 2px 0;
  border-radius: 0 0 3px 0;
}

.hero-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 1.4rem;
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.hero-eyebrow::before {
  content: '';
  display: inline-block;
  width: 32px; height: 1px;
  background: var(--cyan);
}

.hero-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(2.8rem, 6vw, 5.5rem);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin-bottom: 1.5rem;
}

.hero-name span {
  display: block;
  background: linear-gradient(135deg, #ffffff 0%, #c8d8f0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-name .accent {
  background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-role-line {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.hero-role-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.35rem 0.85rem;
  border-radius: 3px;
  background: rgba(99,212,255,0.08);
  border: 1px solid var(--border-cyan);
  color: var(--cyan);
}

.hero-role-tag.violet {
  background: rgba(167,139,250,0.08);
  border-color: rgba(167,139,250,0.2);
  color: var(--violet);
}

.hero-desc {
  font-size: 1rem;
  color: var(--muted);
  line-height: 1.75;
  max-width: 500px;
  margin-bottom: 2.5rem;
  font-weight: 300;
}

.hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; }

.btn-primary {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.9rem 2.2rem;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  color: #050810;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.25s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  transition: opacity 0.2s;
}

.btn-primary:hover::after { opacity: 0.1; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,212,255,0.25); }

.btn-outline {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.9rem 2.2rem;
  background: transparent;
  color: var(--text);
  border: 1px solid rgba(226,232,240,0.18);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.25s;
  text-decoration: none;
  display: inline-block;
}

.btn-outline:hover {
  border-color: rgba(226,232,240,0.45);
  background: rgba(226,232,240,0.04);
  transform: translateY(-2px);
}

.hero-stats {
  display: flex;
  gap: 3rem;
  margin-top: 3.5rem;
  padding-top: 2.5rem;
  border-top: 1px solid rgba(226,232,240,0.06);
  flex-wrap: wrap;
}

.stat-item { display: flex; flex-direction: column; gap: 0.3rem; }

.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--cyan);
  line-height: 1;
}

.stat-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ── SECTION BASE ── */
section {
  position: relative;
  z-index: 1;
  padding: 6rem 3rem;
  max-width: 1200px;
  margin: 0 auto;
}

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  text-align: center;
}

.section-label::before,
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(99,212,255,0.12);
  max-width: 70px;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.9rem, 3.5vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #f1f5f9;
  margin-bottom: 3rem;
  line-height: 1.1;
  text-align: center;
}

/* ── SKILLS ── */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 0.7rem;
  justify-items: center;
}

.skill-pill {
  padding: 0.75rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  text-align: center;
  transition: all 0.22s;
  cursor: default;
  width: 100%;
}

.skill-pill:hover {
  border-color: var(--border-cyan);
  color: var(--cyan);
  background: rgba(99,212,255,0.07);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(99,212,255,0.08);
}

.skill-pill.accent {
  border-color: rgba(167,139,250,0.15);
  color: var(--violet);
  background: rgba(167,139,250,0.04);
}

.skill-pill.accent:hover {
  border-color: rgba(167,139,250,0.4);
  background: rgba(167,139,250,0.09);
  box-shadow: 0 4px 16px rgba(167,139,250,0.08);
}

/* ── TIMELINE ── */
.timeline {
  position: relative;
  padding-left: 0;
  max-width: 900px;
  margin: 0 auto;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 6px; bottom: 0;
  width: 1px;
  opacity: 0.3;
}

.timeline-item {
  position: relative;
  padding-bottom: 3.5rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.timeline-item-card {
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 2rem 2.5rem;
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(6px);
}

.timeline-item-card:hover {
  border-color: rgba(99,212,255,0.14);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(99,212,255,0.06);
}

.timeline-item:last-child { padding-bottom: 0; }

.timeline-item::before {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 6px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 3px rgba(5,8,16,1), 0 0 0 5px rgba(99,212,255,0.35);
  z-index: 1;
}

.timeline-year {
  font-family: 'DM Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.15em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 0.6rem;
  margin-top: 1.4rem;
  background: rgba(99,212,255,0.07);
  border: 1px solid rgba(99,212,255,0.15);
  border-radius: 20px;
  padding: 0.28rem 1rem;
  display: inline-block;
}

.timeline-company {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 0.35rem;
  line-height: 1.25;
}

.timeline-role {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--violet);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.timeline-desc {
  font-size: 0.88rem;
  color: var(--dim);
  line-height: 1.85;
  max-width: 620px;
  margin-bottom: 1.25rem;
  text-align: center;
}

/* ── EDUCATION DETAIL GRID ── */
.edu-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.65rem;
  margin-bottom: 1.25rem;
  max-width: 680px;
  width: 100%;
}

.edu-detail-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 0.75rem 1rem;
}

.edu-detail-card .dc-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 0.3rem;
}

.edu-detail-card .dc-value {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--muted);
  line-height: 1.4;
}

/* ── SUBJECT TAGS ── */
.edu-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 1rem;
  justify-content: center;
}

.edu-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 0.28rem 0.65rem;
  border-radius: 3px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  color: #5a6880;
}

/* ── CERT STRIP ── */
.edu-certs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}

.edu-cert {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: #5a7a6a;
  background: rgba(34,197,94,0.04);
  border: 1px solid rgba(34,197,94,0.12);
  border-radius: 4px;
  padding: 0.3rem 0.75rem;
}

.cert-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #22c55e;
  flex-shrink: 0;
}

/* ── PROJECTS ── */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
}

.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2rem;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  opacity: 0;
  transition: opacity 0.3s;
}

.project-card:hover {
  border-color: rgba(99,212,255,0.18);
  background: rgba(99,212,255,0.025);
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(99,212,255,0.1);
}

.project-card:hover::before { opacity: 1; }

.project-year {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-bottom: 0.85rem;
}

.project-name {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 0.85rem;
  line-height: 1.3;
}

.project-desc {
  font-size: 0.855rem;
  color: var(--dim);
  line-height: 1.75;
  flex: 1;
  margin-bottom: 1.25rem;
}

.project-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }

.project-tag {
  display: inline-block;
  padding: 0.28rem 0.7rem;
  background: rgba(167,139,250,0.07);
  border: 1px solid rgba(167,139,250,0.14);
  border-radius: 3px;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.07em;
  color: var(--violet);
  text-transform: uppercase;
}

/* ── ACHIEVEMENTS ── */
.ach-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1rem;
}

.ach-card {
  padding: 1.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.ach-card::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 80px; height: 80px;
  background: radial-gradient(circle at 100% 100%, rgba(99,212,255,0.05), transparent 70%);
  pointer-events: none;
}

.ach-card:hover {
  border-color: rgba(99,212,255,0.15);
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.2);
}

.ach-icon { font-size: 1.6rem; margin-bottom: 0.9rem; }

.ach-title {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 0.4rem;
}

.ach-year {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--cyan);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.ach-desc { font-size: 0.8rem; color: var(--dim); line-height: 1.65; }

/* ── INTERESTS ── */
.interests-grid { display: flex; flex-wrap: wrap; gap: 0.65rem; justify-content: center; }

.interest-tag {
  padding: 0.55rem 1.15rem;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
  transition: all 0.2s;
}

.interest-tag:hover {
  background: rgba(99,212,255,0.06);
  border-color: rgba(99,212,255,0.22);
  color: var(--cyan);
}

/* ── CONTACT ── */
.contact-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: start;
}

.contact-info p {
  font-size: 0.9rem;
  color: var(--dim);
  line-height: 1.85;
  margin-bottom: 2rem;
  text-align: justify;
}

.contact-links { display: flex; flex-direction: column; gap: 0.7rem; }

.contact-link {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  color: var(--muted);
  font-size: 0.83rem;
  font-family: 'DM Mono', monospace;
  transition: all 0.22s;
  word-break: break-all;
}

.contact-link:hover {
  border-color: rgba(99,212,255,0.22);
  color: var(--cyan);
  background: rgba(99,212,255,0.04);
  transform: translateX(4px);
}

.contact-link-icon {
  width: 34px; height: 34px;
  background: rgba(99,212,255,0.07);
  border: 1px solid rgba(99,212,255,0.1);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
  transition: all 0.2s;
}

.contact-link:hover .contact-link-icon {
  background: rgba(99,212,255,0.12);
  border-color: rgba(99,212,255,0.25);
}

/* ── DIVIDER ── */
.section-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(99,212,255,0.08), transparent);
  margin: 0 auto;
  max-width: 1200px;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 2.5rem 3rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'DM Mono', monospace;
  font-size: 0.63rem;
  letter-spacing: 0.1em;
  color: #334155;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.footer-links { display: flex; gap: 1.5rem; }

.footer-links a {
  color: #334155;
  text-decoration: none;
  transition: color 0.2s;
}

.footer-links a:hover { color: var(--cyan); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

.fade-up { animation: fadeUp 0.75s cubic-bezier(0.22,1,0.36,1) forwards; opacity: 0; }
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.22s; }
.delay-3 { animation-delay: 0.38s; }
.delay-4 { animation-delay: 0.56s; }
.delay-5 { animation-delay: 0.74s; }
.delay-6 { animation-delay: 0.9s; }

@keyframes floatPhoto {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-8px); }
}

.hero-photo-wrap { animation: floatPhoto 6s ease-in-out infinite; }

.reveal { opacity: 0; transform: translateY(22px); transition: all 0.7s cubic-bezier(0.22,1,0.36,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  nav { padding: 1rem 2rem; }
  .nav-links { gap: 1.5rem; }
  section { padding: 5rem 2rem; }
  .hero { padding: 7rem 2rem 5rem; }
  .hero-photo-wrap { width: 240px; height: 240px; }
  .hero-photo-initials { font-size: 3.8rem; }
  .contact-inner { gap: 3rem; }
}

@media (max-width: 900px) {
  .hero-inner { flex-direction: column-reverse; align-items: center; gap: 2.5rem; text-align: center; }
  .hero-photo-wrap { width: 210px; height: 210px; align-self: center; }
  .hero-photo-initials { font-size: 3.2rem; }
    .hero-eyebrow { justify-content: center; }
  .hero-role-line { justify-content: center; }
  .hero-desc { margin-left: auto; margin-right: auto; text-align: left; }
  .hero-ctas { justify-content: center; }
  .hero-stats { justify-content: center; gap: 2rem; }
  .edu-detail-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  nav { padding: 1rem 1.5rem; }
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .nav-download { display: none; }
  section { padding: 4rem 1.5rem; }
  .hero { padding: 6rem 1.5rem 3.5rem; }
  .skills-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .projects-grid { grid-template-columns: 1fr; }
  .ach-grid { grid-template-columns: repeat(2, 1fr); }
  .contact-inner { grid-template-columns: 1fr; gap: 2.5rem; }
  footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem 1.5rem; }
  .footer-links { justify-content: center; }
}

@media (max-width: 560px) {
  .hero-photo-wrap { width: 180px; height: 180px; }
  .hero-photo-initials { font-size: 2.8rem; }
  .hero-stats { gap: 1.5rem; }
  .stat-num { font-size: 1.5rem; }
  .ach-grid { grid-template-columns: 1fr; }
  .edu-detail-grid { grid-template-columns: 1fr 1fr; }
  .btn-primary, .btn-outline { padding: 0.8rem 1.6rem; font-size: 0.7rem; }
  .hero-ctas { flex-direction: column; align-items: center; }
  .hero-ctas .btn-outline { width: 100%; text-align: center; }
  .hero-ctas .btn-primary { width: 100%; justify-content: center; }
}

@media (max-width: 420px) {
  nav { padding: 0.85rem 1rem; }
  section { padding: 3rem 1rem; }
  .hero { padding: 5.5rem 1rem 3rem; }
  .hero-photo-wrap { width: 155px; height: 155px; }
  .hero-photo-initials { font-size: 2.4rem; }
  .skills-grid { grid-template-columns: repeat(2, 1fr); }
  .edu-detail-grid { grid-template-columns: 1fr; }
  .contact-link { font-size: 0.72rem; }
  .timeline { padding-left: 0; }
  .timeline-item::before { left: 50%; transform: translateX(-50%); }
}

@media print {
  nav, .hero-ctas, .nav-download { display: none !important; }
  .portfolio-root::before { display: none; }
}
